<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sign Up - Health & Fitness XAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .signup-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .logo p {
            color: #666;
            font-size: 0.9em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group small {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 0.85em;
        }
        
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert.success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border: 2px solid #28a745;
            font-weight: 600;
            font-size: 1.05em;
            padding: 15px;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <h1>🏃‍♂️ Health & Fitness</h1>
            <p>Create Your Account</p>
        </div>
        
        <div id="alert" class="alert"></div>
        
        <form id="signup-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="6" required>
                <small>At least 6 characters</small>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            
            <button type="submit" class="btn" id="signup-btn">Sign Up</button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>
    
    <script type="module">
        import { firebaseClient } from '/static/firebase-client.js';

        // Clear alert immediately on page load
        document.addEventListener('DOMContentLoaded', function() {
            const alert = document.getElementById('alert');
            if (alert) {
                alert.className = 'alert';
                alert.textContent = '';
            }
        });

        // Initialize Firebase
        let firebaseReady = false;
        firebaseClient.init().then(success => {
            firebaseReady = success;
            if (success) {
                console.log('✓ Firebase ready for signup');
            }
        });

        // Clear error message when user starts typing
        const inputFields = ['name', 'email', 'password', 'confirm-password'];
        inputFields.forEach(fieldId => {
            const field = document.getElementById(fieldId);
            if (field) {
                field.addEventListener('input', function() {
                    const alert = document.getElementById('alert');
                    if (alert && (alert.classList.contains('error') || alert.classList.contains('show'))) {
                        alert.className = 'alert';
                        alert.textContent = '';
                    }
                });
            }
        });

        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const btn = document.getElementById('signup-btn');
            const alert = document.getElementById('alert');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                alert.className = 'alert error show';
                alert.textContent = 'Passwords do not match';
                return;
            }
            
            // Disable button
            btn.disabled = true;
            btn.textContent = 'Creating Account...';
            
            try {
                // Try Firebase registration first if available
                if (firebaseReady) {
                    const fbResult = await firebaseClient.register(email, password, name);
                    if (fbResult.success) {
                        console.log('✓ Firebase registration successful');
                    } else {
                        console.warn('Firebase registration failed, trying backend:', fbResult.error);
                    }
                }

                // Also do backend signup for session management
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert.className = 'alert success show';
                    alert.textContent = '✅ Account created successfully! Redirecting to login...';
                    btn.disabled = true;
                    btn.textContent = 'Account Created ✓';
                    
                    // Hide form fields
                    document.getElementById('signup-form').style.display = 'none';
                    
                    setTimeout(() => {
                        window.location.href = '/login?t=' + Date.now();
                    }, 2000);
                } else {
                    alert.className = 'alert error show';
                    alert.textContent = result.error || 'Signup failed';
                    btn.disabled = false;
                    btn.textContent = 'Sign Up';
                }
            } catch (error) {
                alert.className = 'alert error show';
                alert.textContent = 'An error occurred. Please try again.';
                btn.disabled = false;
                btn.textContent = 'Sign Up';
            }
        });
    </script>
</body>
</html>
